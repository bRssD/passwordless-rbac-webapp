version: "3.9"

services:
  api:
    build: ./api/PasswordlessRbacApi
    container_name: passwordless-rbac-webapp-api
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      ConnectionStrings__Default: "Host=db;Database=passwordlessrbac;Username=postgres;Password=postgres"
    depends_on:
      - db
    networks:
      - app-network

  ui:
    build: ./ui
    container_name: passwordless-rbac-webapp-ui
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_BASE=http://localhost:5000
    depends_on:
      - api
    networks:
      - app-network

  db:
    image: postgres:16
    container_name: passwordless-rbac-webapp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: passwordlessrbac
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
